name: Generate Readme Data

on:
    schedule: 
        - cron: "0 0 * * *"
    workflow_dispatch: 

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
          id-token: write
          pages: write
        environment:
          name: github-pages
          url: ${{ steps.deploy.outputs.page_url }}
        steps:
            - name: get github-readme-stats
              uses: actions/checkout@v6
              with:
                repository: soulteary/github-readme-stats
                ref: v1.0.0
                path: github-readme-stats
            - name: setup go
              uses: actions/setup-go@v5
              with:
                go-version: stable
                cache-dependency-path: "**/*.sum"
            - name: build github-readme-stats
              working-directory: github-readme-stats
              run: go build -o '${{ runner.temp }}/github-readme-stats' ./cmd/server 
            - name: generate-snake
              uses: Platane/snk/svg-only@v3
              with: 
                    github_user_name: ${{ github.repository_owner }}
                    outputs: |
                        ./images/snakes/dark.svg?palette=github-dark&&color_snake=blue
                        ./images/snakes/light.svg?color_snake=#7845ab
              env:
                  GITHUB_TOKEN: ${{ github.token }}
            - name: generate github status
              env:
                PAT_1: ${{ secrets.PAT_1 }}
                PAT_2: ${{ github.token }}
              run: |
                for item in stats top-langs
                do
                  for theme in default dark
                  do
                    mkdir -p "images/$item"
                    args=("--type=$item"
                          '--username=${{ github.repository_owner }}'
                          "--theme=$theme"
                          "--output=images/$item/$theme.svg")
                    '${{ runner.temp }}/github-readme-stats' "${args[@]}"
                  done
                done
            - name: upload pages
              uses: actions/upload-pages-artifact@v3
              with:
                path: images/
            - name: deploy pages
              id: deploy
              uses: actions/deploy-pages@v4
